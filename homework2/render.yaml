services:
  - type: web
    name: movie-theater-booking
    runtime: python
    rootDir: homework2
    buildCommand: "./build.sh"
    startCommand: "gunicorn movie_theater_booking.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: movie-theater-db
          property: connectionString

databases:
  - name: movie-theater-db
    plan: free
